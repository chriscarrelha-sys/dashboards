name: CI
on:
  push: { branches: ['**'] }
  pull_request: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate-env.mjs
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run build
      # Staging deploy + smoke tests + protected production promotion happen here
      # in a real pipeline (see docs/DEPLOYMENT.md). Production deploy is gated on
      # green checks and manual approval — never automatic.
