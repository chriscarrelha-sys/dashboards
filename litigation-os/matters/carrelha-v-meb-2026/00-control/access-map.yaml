known_inaccessible:
  - system: pacer
    what_is_in_it: >
      Defendants' motions to dismiss and their exhibits; every docket entry;
      the operative deadline posture; whether either candidate first amended
      complaint was in fact filed.
    why_unreachable: No PACER account is available to this session.
    gap_ids: GAP-011
    how_a_human_would_get_it: >
      Log in to PACER, purchase the docket sheet and Docs. 4, 5, 22-26 and
      34-36, and confirm the post-8/21 entries.

  - system: primary-loan-documents
    what_is_in_it: >
      The note or HELOC agreement, any allonge or endorsement, the security
      deed, the recorded and unrecorded assignments, the servicing agreement,
      the trust agreement and the loan schedule identifying this loan.
    why_unreachable: >
      Not present in the client repository and not obtainable from any public
      source reached this session. The recorded assignment is known only from
      its book-and-page recital.
    gap_ids: GAP-019; GAP-009; GAP-020; GAP-021
    how_a_human_would_get_it: >
      Forsyth County deed records for the recorded instruments; the rest
      through discovery or a qualified written request.

  - system: borrower-financial-records
    what_is_in_it: >
      The Bank of America account records showing what was actually funded on
      2022-08-05, and the wire confirmation for the December 2023 payment.
    why_unreachable: Held by the client and by the bank; not produced to this session.
    gap_ids: GAP-001; GAP-002; GAP-014
    how_a_human_would_get_it: Client's own statements, or a subpoena to the bank.

  - system: credit-reporting-records
    what_is_in_it: Credit reports, ACDV responses, and furnishing records.
    why_unreachable: Not produced to this session.
    gap_ids: GAP-004
    how_a_human_would_get_it: >
      The client's own annual disclosures, and discovery to the furnisher.
