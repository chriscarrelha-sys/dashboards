# ACCESS MAP — carrelha-v-meb-2026
#
# Where each source system lives, who can reach it, and what THIS session
# actually had. A routing and provenance record, never a credential store.
#
# ABSOLUTE RULE — no secrets in this file, ever: no password, passphrase, PIN,
# MFA/OTP code or seed, security answer, API key, token, cookie or court login.
# This file records WHERE a thing is and WHO holds the key, never the key.
# validate_access_map.py scans the whole pack and fails the build otherwise.

schema_version: "1.0"
matter_id: CARRELHA-2026
compiled_by: Litigation OS (matter-operations-manager), for attorney review
compiled_date: 2026-09-21

systems:

  - key: google-drive
    kind: cloud-storage
    purpose: >
      Primary client document repository. Holds the complaint drafts, the two
      district-court orders, the Shellpoint loan history, the CFPB
      correspondence, and the file named "5200 on Ledger".
    reached_via: Google Drive connector (read)
    credential_holder: client
    credential_location: client's own password manager
    session_access: read
    verified_on: 2026-09-20
    scope_note: >
      Full-text search and read of the files located by search. Eleven
      documents were examined in place and never downloaded or modified;
      verbatim extracts of eight of them were produced into 03-sources/raw/
      with their own SRC- ids. What this shows is what the client kept, not
      what exists: a document's absence here is not evidence it was never
      sent or never created.
    write_permitted: no
    notes: >
      Counts X-XVI of SRC-020 were read at heading level only. No primary
      ownership instrument (note, allonge, security deed, assignment,
      trust agreement, loan schedule) was located here or anywhere.

  - key: courtlistener
    kind: court-record
    purpose: Federal docket record and published opinions.
    reached_via: CourtListener API (RECAP search, opinion full text)
    credential_holder: n/a — public API
    credential_location: n/a
    session_access: read
    verified_on: 2026-09-20
    scope_note: >
      The RECAP record for this case carries metadata and ZERO docket
      entries. RECAP mirrors only what somebody has already purchased, so
      absence from it is not absence from the docket. Every docket fact in
      this pack came from the two orders read in Drive, not from RECAP, and
      the docket register says so row by row.
    write_permitted: no
    notes: Rate limited to roughly 10 requests per minute.

  - key: pacer
    kind: court-record
    purpose: The authoritative federal docket and every filed document.
    reached_via: pacer.uscourts.gov (human login)
    credential_holder: attorney of record / party
    credential_location: that person's own password manager — never here
    session_access: none
    verified_on: n/a
    scope_note: >
      NOT AVAILABLE THIS SESSION. This is the single largest limitation on
      the pack: the motions to dismiss and their exhibits, every docket
      entry, and the current deadline posture all live here and none of
      them has been read.
    write_permitted: no
    cost_note: PACER charges per page; a human authorises each purchase.
    notes: See GAP-011 — no filing after Doc. 35 has been read.

  - key: peachcourt
    kind: court-record
    purpose: >
      Forsyth County Superior Court record for 26CV-0387-1, the pre-removal
      state case, including anything filed before removal on 2026-04-15.
    reached_via: peachcourt.com (human login)
    credential_holder: attorney of record / party
    credential_location: that person's own password manager — never here
    session_access: none
    verified_on: n/a
    scope_note: NOT AVAILABLE THIS SESSION. Nothing in this pack comes from it.
    write_permitted: no
    notes: Filing here requires an approved APR- entry and a human to file it.

  - key: odyssey-efilega
    kind: court-efiling
    purpose: Georgia eFileGA / Odyssey submission.
    reached_via: efilega.tylertech.cloud (human login)
    credential_holder: attorney of record / party
    credential_location: that person's own password manager — never here
    session_access: none
    verified_on: n/a
    write_permitted: no
    notes: >
      No skill and no script submits here. A filing is prepared, QC'd, gated,
      and handed to a human, who files it.

  - key: dropbox
