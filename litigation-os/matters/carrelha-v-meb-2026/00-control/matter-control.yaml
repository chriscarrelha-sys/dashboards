open_factual_questions:
  - id: OFQ-1
    question: "Was an amended complaint filed in 2:26-cv-00110 on or before 2026-08-21, and if so, is SRC-001 that document?"
    why_it_matters: "Determines whether the case is alive, what the operative pleading is, and when Defendants' 14-day response period ran."
    how_to_resolve: "PACER/CM-ECF docket for 2:26-cv-00110-RWS-AWH, or the court's notice of electronic filing."
  - id: OFQ-2
    question: "Is there any record of a $5,200.00 wire payment to the loan account?"
    why_it_matters: "SRC-001 makes an uncredited $5,200.00 wire central to the RESPA, FDCPA, and breach-of-contract counts. No such entry appears anywhere in SRC-013."
    how_to_resolve: "Bank wire confirmation / MT-103 from the sending institution; Shellpoint and SLS suspense and unapplied-funds records; the full servicing file."
  - id: OFQ-3
    question: "Were HELOC loan proceeds actually delivered, on what dates and in what amounts, to Plaintiffs or their creditors?"
    why_it_matters: "Judge Bagley found many claims contingent on this (SRC-010 at 7). No source in this manifest answers it."
    how_to_resolve: "Closing file, settlement statement, closing-attorney trust-account records, wire confirmations, creditor payoff confirmations."
  - id: OFQ-4
    question: "What individual practices or standing orders of Judge Story and Magistrate Judge Howard apply?"
    why_it_matters: "Local practice routinely changes page limits, conferral requirements, and filing mechanics."
    how_to_resolve: "The court's website and the judges' published standing orders."
  - id: OFQ-5
    question: "Was the loan history statement printed 2026-03-10 (SRC-006) the same 'payment history' enclosed with the 2026-03-02 letter (SRC-005)?"
    why_it_matters: "The print date postdates the letter; if they differ, the enclosure to the letter has not been produced."
    how_to_resolve: "The as-mailed enclosure, or Shellpoint's records of what was enclosed."

open_legal_questions:
  - id: OLQ-1
    question: >
      Does the First Amended Complaint's practice of having each Count reallege
      'Paragraphs 1 through 46' satisfy Doc. 35's directive, where the pleading's
      paragraph numbering restarts within each Roman-numeral section so that
      multiple paragraphs bear each number?
    why_it_matters: "Determines whether the amended pleading cures or repeats the shotgun defect, with dismissal cautioned for non-compliance."
    jurisdiction: "Eleventh Circuit; Fed. R. Civ. P. 8(a), 10(b)"
  - id: OLQ-2
    question: >
      May Plaintiffs add Lendage, LLC as a defendant by including it in the
      caption of an amended complaint filed under an order directing repleading,
      without moving under Rule 15 or 21, and where no count is asserted against it?
    why_it_matters: "Bears on whether Lendage is properly before the court and on any Rule 8 notice objection."
    jurisdiction: "Eleventh Circuit; Fed. R. Civ. P. 10(a), 15, 21"
  - id: OLQ-3
    question: "Does a post-merger predecessor servicer remain separately suable, and does suing it by a d/b/a that belongs to another entity create a defect?"
    why_it_matters: "Two of the named defendants' status is disputed on this basis (SRC-010 at 1 n.1)."
    jurisdiction: "Delaware entity law; Georgia procedure; Eleventh Circuit"
  - id: OLQ-4
    question: "Do Rule 34 requests served before any Rule 26(f) conference violate Rule 26(d)(1), and what is the consequence?"
    why_it_matters: "SRC-004 is dated 2026-08-19 and refers to the Rule 26(f) conference as still to come."
    jurisdiction: "Fed. R. Civ. P. 26(d)(1), 26(f); N.D. Ga. Local Rules"

